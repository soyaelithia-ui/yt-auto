# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3.12/3.13, FFmpeg-first media (stream-copy, libass, EBU R128), Edge-TTS, SQLite WAL
  Architecture: Multi-lane YouTube pipeline (agents, media DSP, sanitizers, Telegram review, publishing)
  Testing: pytest (pytest-asyncio, pytest-timeout); tests/{unit,integration,e2e}; live excluded by default
  Style: Modular Python, dataclasses/Pydantic, strict schema validation, offline-mockable
  Constraints: Zero browser in src/media|cli|narrative|core; session-upload fallback only in src/youtube/; WebGPU quarantined

strict_tdd: true

projects:
  - path: .
    stack: Python 3.12/3.13
    test_command: pytest
    framework: pytest
  - path: review
    stack: Python package video-review-core 1.1.0
    test_command: ""
    framework: ""
    covered_by: workspace pytest via tests/

testing:
  runner:
    command: "pytest"
    framework: "pytest"
    notes: "Workspace-level command from repo root; pytest.ini testpaths=tests; CI uses pytest -m \"not live\" -q --timeout=600"
  layers:
    unit:
      available: true
      tool: "pytest"
      path: "tests/unit"
    integration:
      available: true
      tool: "pytest"
      path: "tests/integration"
    e2e:
      available: true
      tool: "pytest"
      path: "tests/e2e"
      notes: "pytest tests/e2e is the runner, not a browser harness"
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Include rollback plan for risky changes
    - Document media processing performance impact
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Require schema compliance for agent contracts
  design:
    - Include sequence diagrams for complex multi-stage flows
    - Document architecture decisions with rationale
    - Adhere to single-pass DSP and EBU R128 mastering standards
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Enforce TDD ordering (write test first)
  apply:
    guidelines:
      - Follow existing code patterns and modular layout
      - Ensure offline synthetic mock testability (zero-quota)
    tdd: true
    test_command: "pytest"
  verify:
    test_command: "pytest -v"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
