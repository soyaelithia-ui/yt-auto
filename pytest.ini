[pytest]
markers =
    unit: Fast unit tests without FFmpeg or network
    integration: Integration tests between internal services
    e2e: End-to-end rendering and pipeline tests
    live: marks tests as live (deselect with '-m "not live"')
    core: Core domain models, SQLite queue, locks, scheduler, channel profiles
    media: Video engines, compositors, subtitles, overlays, thumbnails, FFmpeg
    audio: Edge TTS, procedural audio, voice mastering, audio ducking, SFX
    narrative: Script curation, archetypes, schemas, LLM prompts, story safety
    mcp: Model Context Protocol server, tools, resources, prompts, drift sync
    review: Telegram HITL review bot, approval state machine, proxy video
    observability: System metrics, structured events, retention, analytics
    pipeline: CLI entrypoint, daemons, multi-channel batch dispatching
    fast: Pure in-memory unit tests with sub-second execution
    stress: Heavy computational, frame looping, or memory soak tests
    catalog_media: Empirical tests requiring committed production video loops
    asyncio: Async tests executed via pytest-asyncio
    vcr: mark test to record/replay API calls
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary & Corner Cases tests
    tier3: Tier 3 Cross-Feature Integration tests
    tier4: Tier 4 Real-World Scenario tests
addopts = -v -m "not live and not catalog_media and not stress" -n 2 --dist=loadfile --timeout=120
pythonpath = .
testpaths =
    tests

