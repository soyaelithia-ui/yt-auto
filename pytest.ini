[pytest]
markers =
    unit: Fast unit tests without FFmpeg or network
    integration: Integration tests between internal services
    e2e: End-to-end rendering and pipeline tests
    live: marks tests as live (deselect with '-m "not live"')
    asyncio: Async tests executed via pytest-asyncio
    vcr: mark test to record/replay API calls
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary & Corner Cases tests
    tier3: Tier 3 Cross-Feature Integration tests
    tier4: Tier 4 Real-World Scenario tests
addopts = -v -m "not live"
pythonpath = .
testpaths =
    tests

