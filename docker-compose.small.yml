# Low-RAM overlay (meta near-zero). Live smoke ≈ 84–88 MB RSS.
# CI budgets (rss_budgets): Δ8/9 ≤16 MB, peak ≤512 MB ≪ mem_limit 2g.
# Uso: docker compose -f docker-compose.yml -f docker-compose.small.yml up -d
services:
  yt-automation:
    mem_limit: 2g
    cpus: 2.0
    shm_size: 256m
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,mode=1777

  yt-horror:
    mem_limit: 1g
    cpus: 1.0
    shm_size: 128m
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777

  yt-drama:
    mem_limit: 1g
    cpus: 1.0
    shm_size: 128m
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777

  yt-moku:
    mem_limit: 1g
    cpus: 1.0
    shm_size: 128m
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777

  yt-aelithia:
    mem_limit: 1g
    cpus: 1.0
    shm_size: 128m
    pids_limit: 128
    tmpfs:
      - /tmp:size=256m,mode=1777
