[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-review-core"
version = "1.1.0"
description = "Video review core: Telegram human-review gate and publication state store."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
]

[tool.setuptools]
packages = ["review"]