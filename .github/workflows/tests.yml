# GitHub-hosted runners on this private repo are billing-blocked
# (jobs never start). The real gate is local: ./scripts/test.sh
# or `python main.py test`. Manual dispatch only — no auto red X.
name: tests

on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Clean install (requirements must be complete)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Live RSS gate (stages 8–9 near-zero)
        env:
          YT_PROFILE: test
        run: pytest tests/unit/test_live_rss_gate.py -q --timeout=120
      - name: D2 mock timing gate (moku-scp-shorts)
        env:
          YT_PROFILE: test
        run: pytest tests/unit/test_d2_timing_gate.py -q --timeout=120
      - name: Run offline suite (live tests excluded)
        env:
          YT_PROFILE: test
          YT_LIVE_RSS_PEAK_MB: 768
        run: pytest -m "not live" -q --timeout=600
