<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber_cyan_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cyber_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lateral Framing Tactical Brackets (x in [70, 940], y in [220, 1420]) -->
  <path d="M 70 280 L 70 220 L 140 220" stroke="#00FFCC" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 870 220 L 940 220 L 940 280" stroke="#00FFCC" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 70 1360 L 70 1420 L 140 1420" stroke="#00FFCC" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 870 1420 L 940 1420 L 940 1360" stroke="#00FFCC" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Top Telemetry Panel -->
  <g transform="translate(85, 235)">
    <!-- Node Status Pill -->
    <rect x="0" y="0" width="220" height="34" rx="4" fill="#02141C" fill-opacity="0.85" stroke="#00FFCC" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="6" fill="#00FF88" filter="url(#cyber_glow)"/>
    <text x="34" y="24" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00FFCC">
      NODE: {{node_id:NODE-01}}
    </text>

    <!-- Frequency Indicator -->
    <rect x="235" y="0" width="200" height="34" rx="4" fill="#02141C" fill-opacity="0.85" stroke="#0088FF" stroke-width="1.5"/>
    <text x="248" y="24" font-family="'Courier New', monospace" font-size="16" fill="#88DDFF">
      FREQ: {{frequency_ghz:14.28}} GHz
    </text>

    <!-- Encryption Status -->
    <rect x="450" y="0" width="370" height="34" rx="4" fill="#02141C" fill-opacity="0.85" stroke="#00FF88" stroke-width="1.5"/>
    <text x="465" y="24" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00FF88">
      CIPHER: {{encryption_cipher:AES-256}} // SECURE
    </text>
  </g>

  <!-- Lateral Mini Grid Bar -->
  <g transform="translate(85, 300)" stroke="#00FFCC" stroke-width="1" opacity="0.5">
    <line x1="0" y1="0" x2="160" y2="0"/>
    <line x1="0" y1="6" x2="120" y2="6"/>
    <line x1="0" y1="12" x2="80" y2="12"/>
  </g>

  <!-- Mid-Screen Tactical Hexagon & Waveform Monitor -->
  <g transform="translate(85, 800)">
    <!-- Hexagonal Ring -->
    <polygon points="455,0 485,18 485,52 455,70 425,52 425,18" fill="none" stroke="#00FFCC" stroke-width="1.5" opacity="0.7"/>
    <!-- Waveform Pulse Lines -->
    <path d="M 120 35 L 280 35 L 310 15 L 330 55 L 350 20 L 370 45 L 390 35 L 425 35" stroke="#00FF88" stroke-width="2" fill="none"/>
    <path d="M 485 35 L 520 35 L 540 10 L 560 60 L 580 25 L 600 45 L 620 35 L 770 35" stroke="#0088FF" stroke-width="2" fill="none"/>
  </g>

  <!-- Bottom Data Readout Panel (y=1340, inside safe zone <= 1460) -->
  <g transform="translate(85, 1340)">
    <rect x="0" y="0" width="840" height="60" rx="6" fill="#02141C" fill-opacity="0.88" stroke="#00FFCC" stroke-width="1.5"/>
    <text x="24" y="26" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00FF88">
      COORDINATES: {{coordinates:34.0522N 118.2437W}}
    </text>
    <text x="24" y="48" font-family="'Courier New', monospace" font-size="14" fill="#00FFCC">
      STATUS: SYSTEM ONLINE // ENCRYPTED DATASTREAM // UPTIME 99.98%
    </text>
    <rect x="710" y="14" width="110" height="32" rx="3" fill="#00FFCC" fill-opacity="0.2" stroke="#00FFCC" stroke-width="1"/>
    <text x="725" y="36" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00FFCC">
      LIVE FEED
    </text>
  </g>
</svg>
