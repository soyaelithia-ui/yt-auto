<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hud_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Framing Reticles -->
  <path d="M 60 120 L 180 120 M 60 120 L 60 240" stroke="#00FFCC" stroke-width="4" fill="none"/>
  <path d="M 1020 120 L 900 120 M 1020 120 L 1020 240" stroke="#00FFCC" stroke-width="4" fill="none"/>
  <path d="M 60 1800 L 180 1800 M 60 1800 L 60 1680" stroke="#00FFCC" stroke-width="4" fill="none"/>
  <path d="M 1020 1800 L 900 1800 M 1020 1800 L 1020 1680" stroke="#00FFCC" stroke-width="4" fill="none"/>
  
  <!-- Header Telemetry Readout -->
  <rect x="70" y="80" width="460" height="40" fill="#001a24" fill-opacity="0.75" stroke="#00FFCC" stroke-width="2"/>
  <text x="85" y="107" font-family="monospace" font-size="20" font-weight="bold" fill="#00FFCC">TELEMETRY: {{telemetry_text}}</text>
  
  <!-- Diagnostic BPM Readout -->
  <rect x="790" y="80" width="220" height="40" fill="#001a24" fill-opacity="0.75" stroke="#00FFCC" stroke-width="2"/>
  <text x="810" y="107" font-family="monospace" font-size="20" font-weight="bold" fill="#00FFCC">BPM: {{bpm}}</text>
  
  <!-- Center Crosshair Reticle -->
  <circle cx="540" cy="960" r="140" stroke="#00FFCC" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.4"/>
  <circle cx="540" cy="960" r="40" stroke="#00FFCC" stroke-width="1.5" fill="none" opacity="0.6"/>
  <line x1="510" y1="960" x2="570" y2="960" stroke="#00FFCC" stroke-width="2" opacity="0.6"/>
  <line x1="540" y1="930" x2="540" y2="990" stroke="#00FFCC" stroke-width="2" opacity="0.6"/>
</svg>
