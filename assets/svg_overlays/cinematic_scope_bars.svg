<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scope_grad_top" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1.00"/>
    </linearGradient>
    <linearGradient id="scope_grad_bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1.00"/>
    </linearGradient>
  </defs>

  <!-- Upper Anamorphic Scope Matte Bar -->
  <rect x="0" y="0" width="1080" height="180" fill="url(#scope_grad_top)"/>
  <line x1="0" y1="180" x2="1080" y2="180" stroke="#444444" stroke-width="1.5"/>

  <!-- Lower Anamorphic Scope Matte Bar -->
  <rect x="0" y="1460" width="1080" height="460" fill="url(#scope_grad_bottom)"/>
  <line x1="0" y1="1460" x2="1080" y2="1460" stroke="#444444" stroke-width="1.5"/>

  <!-- Top Matte Gauge Readout (Anchored at safe zone y=210) -->
  <g transform="translate(100, 205)">
    <!-- Framing tick marks -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#888888" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="10" stroke="#888888" stroke-width="1.5"/>
    <text x="75" y="10" font-family="'Courier New', monospace" font-size="18" fill="#CCCCCC" letter-spacing="1">CINEMA SCOPE // {{aspect_ratio_label:2.39:1 CINEMATIC}}</text>
  </g>

  <g transform="translate(760, 205)">
    <text x="0" y="10" font-family="'Courier New', monospace" font-size="16" fill="#888888" letter-spacing="1">FPS: 24.000 RAW</text>
    <line x1="140" y1="0" x2="200" y2="0" stroke="#888888" stroke-width="2"/>
  </g>

  <!-- Center Optical Crosshair -->
  <g transform="translate(540, 820)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="-40" y1="0" x2="40" y2="0"/>
    <line x1="0" y1="-40" x2="0" y2="40"/>
    <circle cx="0" cy="0" r="28" fill="none"/>
  </g>

  <!-- Bottom Framing Safe Bounds Gauge (y=1430, inside <= 1460) -->
  <g transform="translate(100, 1435)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#666666" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#666666" stroke-width="2"/>
    <text x="55" y="-2" font-family="'Courier New', monospace" font-size="16" fill="#777777">FRAME SAFE // 2.39:1 DCI MASTER</text>
  </g>
</svg>
