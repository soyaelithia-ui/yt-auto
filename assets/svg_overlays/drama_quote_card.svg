<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="quote_card_shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Centered Frosted Glass Quote Card (x in [100, 980], y in [640, 1280]) -->
  <g transform="translate(100, 640)" filter="url(#quote_card_shadow)">
    <!-- Frosted Translucent Card Backdrop -->
    <rect x="0" y="0" width="880" height="540" rx="20" fill="#141414" fill-opacity="0.78" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.9"/>
    <!-- Inner Accent Inset Border -->
    <rect x="12" y="12" width="856" height="516" rx="14" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Stylized Golden Quotation Glyph -->
    <text x="60" y="110" font-family="'Georgia', serif" font-size="90" font-weight="bold" fill="#D4AF37" fill-opacity="0.5">“</text>

    <!-- Dynamic Narrative Quote Text -->
    <text x="70" y="180" font-family="'Georgia', serif" font-size="34" font-style="italic" fill="#F4E8D1" fill-opacity="0.95">
      <tspan x="70" dy="0">{{quote_text:We suffer more often in imagination than in reality.}}</tspan>
    </text>

    <!-- Golden Divider Line -->
    <line x1="70" y1="360" x2="380" y2="360" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Author & Source Attribution -->
    <text x="70" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" letter-spacing="3">
      — {{author_name:SENECA}}
    </text>
    <text x="70" y="455" font-family="'Georgia', serif" font-size="20" font-style="italic" fill="#C5A059" letter-spacing="1">
      {{source_context:Letters from a Stoic}}
    </text>
  </g>
</svg>
