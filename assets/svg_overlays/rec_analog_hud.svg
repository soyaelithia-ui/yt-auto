<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vhs_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Safe Zone Viewport Framing Corner Brackets (x in [70, 940], y in [190, 1450]) -->
  <path d="M 70 230 L 70 190 L 110 190" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7" fill="none"/>
  <path d="M 900 190 L 940 190 L 940 230" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7" fill="none"/>
  <path d="M 70 1410 L 70 1450 L 110 1450" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7" fill="none"/>
  <path d="M 900 1450 L 940 1450 L 940 1410" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7" fill="none"/>

  <!-- Top Left: Red Recording Dot & REC Indicator -->
  <g transform="translate(80, 205)">
    <circle cx="16" cy="16" r="10" fill="#FF0033" filter="url(#vhs_glow)"/>
    <text x="36" y="24" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#FFFFFF" letter-spacing="2">● REC</text>
    <text x="140" y="24" font-family="'Courier New', monospace" font-size="20" fill="#AAAAAA">[{{tape_mode:SP}}]</text>
  </g>

  <!-- Top Right: Battery Icon & Percentage -->
  <g transform="translate(760, 205)">
    <rect x="0" y="6" width="46" height="22" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>
    <rect x="46" y="12" width="4" height="10" rx="1" fill="#FFFFFF" fill-opacity="0.8"/>
    <rect x="4" y="10" width="30" height="14" rx="2" fill="#00FF66" fill-opacity="0.85"/>
    <text x="60" y="24" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#FFFFFF">{{battery_pct:85%}}</text>
  </g>

  <!-- Central Subtle Crosshair Reticle -->
  <g transform="translate(540, 820)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="-30" y1="0" x2="-8" y2="0"/>
    <line x1="8" y1="0" x2="30" y2="0"/>
    <line x1="0" y1="-30" x2="0" y2="-8"/>
    <line x1="0" y1="8" x2="0" y2="30"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke-dasharray="3 3"/>
  </g>

  <!-- Bottom Left: Audio VU Meter -->
  <g transform="translate(80, 1380)">
    <text x="0" y="14" font-family="'Courier New', monospace" font-size="16" fill="#AAAAAA">CH-1</text>
    <rect x="50" y="2" width="18" height="12" fill="#00FF66" fill-opacity="0.8"/>
    <rect x="72" y="2" width="18" height="12" fill="#00FF66" fill-opacity="0.8"/>
    <rect x="94" y="2" width="18" height="12" fill="#00FF66" fill-opacity="0.8"/>
    <rect x="116" y="2" width="18" height="12" fill="#FFCC00" fill-opacity="0.8"/>
    <rect x="138" y="2" width="18" height="12" fill="#FF0033" fill-opacity="0.8"/>
    <text x="0" y="34" font-family="'Courier New', monospace" font-size="16" fill="#AAAAAA">CH-2</text>
    <rect x="50" y="22" width="18" height="12" fill="#00FF66" fill-opacity="0.8"/>
    <rect x="72" y="22" width="18" height="12" fill="#00FF66" fill-opacity="0.8"/>
    <rect x="94" y="22" width="18" height="12" fill="#FFCC00" fill-opacity="0.8"/>
  </g>

  <!-- Bottom Left Date & Bottom Right Timestamp -->
  <text x="80" y="1440" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#EEEEEE" letter-spacing="2">{{rec_date:1994-10-24}}</text>
  <text x="680" y="1440" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#EEEEEE" letter-spacing="2">{{rec_time:00:14:32}}</text>
</svg>
