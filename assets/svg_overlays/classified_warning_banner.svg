<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hazard_stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#FFCC00"/>
      <rect x="20" width="20" height="40" fill="#1A1A1A"/>
    </pattern>
    <filter id="banner_shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Banner Container Group (x=90, y=210, width=900, height=220) -> strictly inside safe zone -->
  <g transform="translate(90, 210)" filter="url(#banner_shadow)">
    <!-- Top Hazard Stripe Bar -->
    <rect x="0" y="0" width="900" height="18" fill="url(#hazard_stripes)"/>

    <!-- Main Banner Body -->
    <rect x="0" y="18" width="900" height="184" fill="#0D0404" fill-opacity="0.94" stroke="#CC1111" stroke-width="2"/>

    <!-- Bottom Hazard Stripe Bar -->
    <rect x="0" y="202" width="900" height="18" fill="url(#hazard_stripes)"/>

    <!-- Caution Emblem Triangle -->
    <g transform="translate(35, 45)">
      <polygon points="40,10 75,75 5,75" fill="#FFCC00" stroke="#000000" stroke-width="3"/>
      <text x="35" y="65" font-family="sans-serif" font-size="42" font-weight="900" fill="#000000">!</text>
    </g>

    <!-- Classification Tier Header -->
    <rect x="135" y="42" width="340" height="34" fill="#CC1111" rx="3"/>
    <text x="145" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="2">
      {{classification_tier:LEVEL 4 RESTRICTED}}
    </text>

    <!-- Redacted Document ID Bar -->
    <rect x="500" y="48" width="160" height="22" fill="#000000"/>
    <text x="510" y="65" font-family="monospace" font-size="16" fill="#888888">[REDACTED]</text>

    <!-- Dynamic Warning Message -->
    <text x="135" y="115" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#FF4444" letter-spacing="1">
      {{warning_message:UNAUTHORIZED ACCESS PROHIBITED}}
    </text>

    <!-- Subtext Protocol Alert -->
    <text x="135" y="152" font-family="'Courier New', monospace" font-size="18" fill="#CCCCCC" letter-spacing="1">
      PROTOCOL 99-OMEGA ACTIVE // AUTOMATIC LETHAL DEFENSE ENGAGED
    </text>

    <!-- Security Check Stamp Outline -->
    <rect x="740" y="40" width="130" height="50" rx="4" fill="none" stroke="#FFCC00" stroke-width="2" stroke-opacity="0.8"/>
    <text x="755" y="72" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFCC00" letter-spacing="1">SEC-CLEAR</text>
  </g>
</svg>
