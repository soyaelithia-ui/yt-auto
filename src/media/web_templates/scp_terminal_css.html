<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030a04; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

window.__setDimensions = function(w, h, seed = 42) {
  canvas.width = w;
  canvas.height = h;
};

// 3D Icosahedron vertices & edges for classified wireframe anomaly
const vertices = [];
const phi = (1 + Math.sqrt(5)) / 2;
[
  [-1,  phi, 0], [ 1,  phi, 0], [-1, -phi, 0], [ 1, -phi, 0],
  [ 0, -1,  phi], [ 0,  1,  phi], [ 0, -1, -phi], [ 0,  1, -phi],
  [ phi, 0, -1], [ phi, 0,  1], [-phi, 0, -1], [-phi, 0,  1]
].forEach(v => {
  const len = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
  vertices.push([v[0]/len, v[1]/len, v[2]/len]);
});

const edges = [];
for (let i = 0; i < vertices.length; i++) {
  for (let j = i + 1; j < vertices.length; j++) {
    const d2 = Math.pow(vertices[i][0]-vertices[j][0], 2) +
               Math.pow(vertices[i][1]-vertices[j][1], 2) +
               Math.pow(vertices[i][2]-vertices[j][2], 2);
    if (Math.abs(d2 - 1.05) < 0.15) {
      edges.push([i, j]);
    }
  }
}

window.renderSceneFrame = function(frameIndex, totalFrames, timeSec, durationSec = 8.0) {
  const w = canvas.width;
  const h = canvas.height;
  const progress = timeSec / durationSec;
  const angle = progress * Math.PI * 2;

  // Phosphor green terminal background
  ctx.fillStyle = '#010803';
  ctx.fillRect(0, 0, w, h);

  // Surveillance Grid
  ctx.strokeStyle = 'rgba(20, 100, 45, 0.22)';
  ctx.lineWidth = 1;
  const gridSize = 50;
  for (let x = 0; x < w; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  for (let y = 0; y < h; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  // Header Banner: Level 4 Classification
  ctx.fillStyle = 'rgba(0, 30, 10, 0.85)';
  ctx.fillRect(20, 20, w - 40, 42);
  ctx.strokeStyle = '#00ff66';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(20, 20, w - 40, 42);

  ctx.fillStyle = '#00ff66';
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText('SCP FOUNDATION // SECURE TERMINAL ATLS-12 // TOP SECRET LEVEL 4', 35, 46);

  const blink = Math.floor(timeSec * 3) % 2 === 0;
  ctx.fillStyle = blink ? '#ff3344' : '#551122';
  ctx.fillText('● LIVE TELEMETRY FEED', w - 240, 46);

  // Left Telemetry Box
  ctx.fillStyle = 'rgba(2, 20, 8, 0.75)';
  ctx.fillRect(25, 80, 280, 160);
  ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
  ctx.strokeRect(25, 80, 280, 160);

  ctx.fillStyle = '#33ff88';
  ctx.font = '12px "Courier New", monospace';
  const depth = 3140 + Math.sin(timeSec * 0.5) * 12;
  const press = (depth * 0.0101).toFixed(2);
  const cogIdx = (0.78 + 0.15 * Math.sin(timeSec * 1.8)).toFixed(3);
  ctx.fillText(`SUB-SURFACE DEPTH: ${depth.toFixed(1)} m`, 38, 106);
  ctx.fillText(`HYDROSTATIC PRESS: ${press} MPa`, 38, 130);
  ctx.fillText(`ANOMALY MASS: 8.42 x 10^8 kg`, 38, 154);
  ctx.fillText(`COGNITOHAZARD: ${cogIdx} [CRIT]`, 38, 178);
  ctx.fillText(`STATUS: CONTAINMENT PROTOCOL ACTIVE`, 38, 202);

  // Draw 3D Rotating Anomaly Wireframe in Center
  const rotY = angle;
  const rotX = Math.sin(angle * 0.8) * 0.45;
  const scale = Math.min(w, h) * 0.24;
  const cx = w * 0.54;
  const cy = h * 0.52;

  const proj = vertices.map(v => {
    let x1 = v[0] * Math.cos(rotY) + v[2] * Math.sin(rotY);
    let y1 = v[1];
    let z1 = -v[0] * Math.sin(rotY) + v[2] * Math.cos(rotY);
    let y2 = y1 * Math.cos(rotX) - z1 * Math.sin(rotX);
    let z2 = y1 * Math.sin(rotX) + z1 * Math.cos(rotX);
    return [cx + x1 * scale, cy + y2 * scale];
  });

  ctx.strokeStyle = '#00ff66';
  ctx.lineWidth = 2.2;
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 14;
  edges.forEach(e => {
    ctx.beginPath();
    ctx.moveTo(proj[e[0]][0], proj[e[0]][1]);
    ctx.lineTo(proj[e[1]][0], proj[e[1]][1]);
    ctx.stroke();
  });
  ctx.shadowBlur = 0;

  // Radar circular rings & target reticle
  ctx.strokeStyle = 'rgba(0, 255, 102, 0.3)';
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 1.3, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, scale * 1.75, 0, Math.PI * 2);
  ctx.stroke();

  // Radar sweep line
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(angle * 1.8) * scale * 1.75, cy + Math.sin(angle * 1.8) * scale * 1.75);
  ctx.strokeStyle = 'rgba(120, 255, 170, 0.65)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Bottom Audio/Amnestic Flux Waveform
  ctx.strokeStyle = '#00e5a3';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const waveY = h - 60;
  for (let x = 30; x < w - 30; x += 4) {
    const waveSin = Math.sin((x * 0.04) + timeSec * 6.0) * Math.cos((x * 0.015) - timeSec * 2.5);
    const wy = waveY + waveSin * 16;
    if (x === 30) ctx.moveTo(x, wy);
    else ctx.lineTo(x, wy);
  }
  ctx.stroke();

  ctx.fillStyle = '#00e5a3';
  ctx.font = '11px "Courier New", monospace';
  ctx.fillText('BIO-ACOUSTIC RESONANCE / AMNESTIC COMPOUND Y-909 FLUX FREQUENCY', 35, h - 35);

  // CRT Scanlines
  ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
  for (let y = 0; y < h; y += 4) {
    ctx.fillRect(0, y, w, 2);
  }

  // Vignette & Phosphor Glow
  const vig = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.35, w/2, h/2, Math.max(w,h)*0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,18,6,0.92)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);
};
</script>
</body>
</html>
