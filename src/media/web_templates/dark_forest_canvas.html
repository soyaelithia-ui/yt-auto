<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050a06; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let spores = [];
let trees = [];
let seedVal = 42;

function pseudoRandom() {
  seedVal = (seedVal * 9301 + 49297) % 233280;
  return seedVal / 233280;
}

window.__setDimensions = function(w, h, seed = 42) {
  canvas.width = w;
  canvas.height = h;
  seedVal = seed;
  
  // Generate static tree silhouettes
  trees = [];
  const numTrees = Math.floor(w / 70);
  for (let i = 0; i < numTrees; i++) {
    trees.push({
      x: (i + pseudoRandom() * 0.8) * (w / numTrees),
      width: 14 + pseudoRandom() * 26,
      height: h * (0.6 + pseudoRandom() * 0.35),
      layer: pseudoRandom() > 0.5 ? 1 : 2,
      branches: [
        { y: 0.3 + pseudoRandom() * 0.2, len: 40 + pseudoRandom() * 50, dir: -1 },
        { y: 0.5 + pseudoRandom() * 0.2, len: 40 + pseudoRandom() * 50, dir: 1 },
        { y: 0.7 + pseudoRandom() * 0.15, len: 30 + pseudoRandom() * 40, dir: -1 }
      ]
    });
  }

  // Generate spores with harmonic periodic speeds
  spores = [];
  for (let i = 0; i < 90; i++) {
    spores.push({
      x: pseudoRandom() * w,
      baseY: pseudoRandom() * h,
      size: 1.5 + pseudoRandom() * 3.5,
      freqX: 1 + Math.floor(pseudoRandom() * 3),
      freqY: 1 + Math.floor(pseudoRandom() * 2),
      phase: pseudoRandom() * Math.PI * 2,
      color: pseudoRandom() > 0.4 ? 'rgba(90, 240, 140, ' : 'rgba(160, 255, 200, '
    });
  }
};

window.renderSceneFrame = function(frameIndex, totalFrames, timeSec, durationSec = 8.0) {
  const w = canvas.width;
  const h = canvas.height;
  const progress = timeSec / durationSec;
  const angle = progress * Math.PI * 2;
  
  // Background Gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
  bgGrad.addColorStop(0, '#040d07');
  bgGrad.addColorStop(0.5, '#08170e');
  bgGrad.addColorStop(1, '#020603');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // Background Eerie Moon / Glow
  const moonGrad = ctx.createRadialGradient(w * 0.5, h * 0.25, 10, w * 0.5, h * 0.25, w * 0.4);
  moonGrad.addColorStop(0, 'rgba(110, 170, 130, 0.25)');
  moonGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = moonGrad;
  ctx.fillRect(0, 0, w, h);

  // Draw Background Tree Layer (Fainter)
  ctx.fillStyle = '#061309';
  trees.filter(t => t.layer === 2).forEach(t => {
    drawTree(t, w, h, angle, 0.5);
  });

  // Mist Layer 1
  drawMist(w, h, angle, 0.4, '#091c10', 0.25);

  // Foreground Tree Layer (Darker)
  ctx.fillStyle = '#020804';
  trees.filter(t => t.layer === 1).forEach(t => {
    drawTree(t, w, h, angle, 1.0);
  });

  // Mist Layer 2
  drawMist(w, h, angle + Math.PI, 0.7, '#07150c', 0.35);

  // Floating Bioluminescent Spores (Harmonically seamless loop)
  spores.forEach(s => {
    const posX = (s.x + Math.sin(angle * s.freqX + s.phase) * 35 + w) % w;
    const posY = (s.baseY + Math.cos(angle * s.freqY + s.phase) * 25 + h) % h;
    const alpha = 0.3 + 0.6 * (0.5 + 0.5 * Math.sin(angle * 2.0 + s.phase));
    
    ctx.beginPath();
    ctx.arc(posX, posY, s.size, 0, Math.PI * 2);
    ctx.fillStyle = s.color + alpha + ')';
    ctx.shadowColor = '#50fa90';
    ctx.shadowBlur = 10;
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Vignette
  const vigGrad = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.7);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, w, h);
};

function drawTree(t, w, h, angle, swayMult) {
  const sway = Math.sin(angle) * 8 * swayMult;
  ctx.beginPath();
  ctx.moveTo(t.x - t.width/2, h);
  ctx.lineTo(t.x + t.width/2, h);
  ctx.lineTo(t.x + sway + t.width*0.2, h - t.height);
  ctx.lineTo(t.x + sway - t.width*0.2, h - t.height);
  ctx.closePath();
  ctx.fill();

  // Branches
  t.branches.forEach(b => {
    const by = h - t.height * b.y;
    const bx = t.x + sway * b.y;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + b.dir * (b.len + Math.sin(angle + b.y) * 4), by - b.len * 0.4);
    ctx.lineWidth = t.width * 0.2;
    ctx.strokeStyle = ctx.fillStyle;
    ctx.stroke();
  });
}

function drawMist(w, h, angle, yPosRatio, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, h);
  const baseH = h * yPosRatio;
  for (let x = 0; x <= w; x += 40) {
    const wave = Math.sin(x * 0.005 + angle) * 30 + Math.cos(x * 0.01 - angle * 2) * 15;
    ctx.lineTo(x, baseH + wave);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
</script>
</body>
</html>
