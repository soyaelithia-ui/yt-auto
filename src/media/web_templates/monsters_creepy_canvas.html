<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030102; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let eyes = [];
let tentacles = [];
let seedVal = 101;

function pseudoRandom() {
  seedVal = (seedVal * 9301 + 49297) % 233280;
  return seedVal / 233280;
}

window.__setDimensions = function(w, h, seed = 101) {
  canvas.width = w;
  canvas.height = h;
  seedVal = seed;

  eyes = [];
  const numEyes = 14;
  for (let i = 0; i < numEyes; i++) {
    eyes.push({
      x: w * (0.15 + pseudoRandom() * 0.7),
      y: h * (0.15 + pseudoRandom() * 0.7),
      size: 8 + pseudoRandom() * 16,
      blinkPhase: pseudoRandom() * Math.PI * 2,
      lookSpeed: 1 + Math.floor(pseudoRandom() * 2),
      color: pseudoRandom() > 0.3 ? '#ff2233' : '#ff9900'
    });
  }

  tentacles = [];
  const numTentacles = 8;
  for (let i = 0; i < numTentacles; i++) {
    tentacles.push({
      rootX: w * (0.1 + (i / numTentacles) * 0.8),
      rootY: h,
      length: h * (0.4 + pseudoRandom() * 0.4),
      segments: 20,
      phase: pseudoRandom() * Math.PI * 2,
      thickness: 16 + pseudoRandom() * 24
    });
  }
};

window.renderSceneFrame = function(frameIndex, totalFrames, timeSec, durationSec = 8.0) {
  const w = canvas.width;
  const h = canvas.height;
  const progress = timeSec / durationSec;
  const angle = progress * Math.PI * 2;

  // Deep blood black background
  const bgGrad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, Math.max(w,h)*0.8);
  bgGrad.addColorStop(0, '#1a0307');
  bgGrad.addColorStop(0.6, '#080103');
  bgGrad.addColorStop(1, '#000000');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // Draw writhing tentacles in darkness
  tentacles.forEach(t => {
    ctx.beginPath();
    ctx.moveTo(t.rootX, t.rootY);
    let currX = t.rootX;
    let currY = t.rootY;
    const segLen = t.length / t.segments;

    for (let s = 1; s <= t.segments; s++) {
      const segRatio = s / t.segments;
      const wave = Math.sin(angle * 2 + t.phase + segRatio * Math.PI * 3) * (segRatio * 45);
      currX += wave * 0.3;
      currY -= segLen;
      ctx.lineTo(currX, currY);
    }
    
    ctx.lineWidth = t.thickness;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#050102';
    ctx.stroke();

    ctx.lineWidth = t.thickness * 0.4;
    ctx.strokeStyle = '#120206';
    ctx.stroke();
  });

  // Glowing Blinking Creepy Eyes
  eyes.forEach(e => {
    // Periodic blink factor (f(0) == f(2pi))
    const blink = Math.sin(angle * 3 + e.blinkPhase);
    if (blink < -0.6) return; // Closed eye during blink
    
    const openRatio = Math.max(0.08, (blink + 0.6) / 1.6);
    const lookX = Math.sin(angle * e.lookSpeed + e.blinkPhase) * (e.size * 0.3);
    const lookY = Math.cos(angle * e.lookSpeed + e.blinkPhase) * (e.size * 0.15);

    ctx.save();
    ctx.translate(e.x, e.y);
    
    // Outer eye socket shadow
    ctx.beginPath();
    ctx.ellipse(0, 0, e.size * 1.4, e.size * openRatio * 1.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();

    // Sclera / Glowing Iris
    ctx.beginPath();
    ctx.ellipse(0, 0, e.size, e.size * openRatio, 0, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Slit Pupil
    ctx.beginPath();
    ctx.ellipse(lookX, lookY, e.size * 0.2, e.size * openRatio * 0.85, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();

    ctx.restore();
  });

  // Vignette & Noise overlay
  const vigGrad = ctx.createRadialGradient(w/2, h/2, w*0.2, w/2, h/2, Math.max(w,h)*0.75);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, w, h);
};
</script>
</body>
</html>
