<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07060f; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

window.__setDimensions = function(w, h, seed = 42) {
  canvas.width = w;
  canvas.height = h;
};

window.renderSceneFrame = function(frameIndex, totalFrames, timeSec, durationSec = 8.0) {
  const w = canvas.width;
  const h = canvas.height;
  const progress = timeSec / durationSec;
  const angle = progress * Math.PI * 2;

  // Dark violet-indigo gradient
  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#090514');
  bg.addColorStop(0.5, '#120a28');
  bg.addColorStop(1, '#05020a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  // Flowing ribbon layers
  const ribbons = [
    { freq: 2, amp: 70, yOffset: 0.45, color: 'rgba(255, 60, 120, 0.4)', blur: 20 },
    { freq: 3, amp: 90, yOffset: 0.50, color: 'rgba(120, 50, 255, 0.5)', blur: 25 },
    { freq: 2, amp: 80, yOffset: 0.55, color: 'rgba(0, 200, 255, 0.4)', blur: 20 },
    { freq: 4, amp: 50, yOffset: 0.60, color: 'rgba(255, 180, 50, 0.3)', blur: 15 }
  ];

  ribbons.forEach((r, idx) => {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, h);
    
    const baseY = h * r.yOffset;
    for (let x = 0; x <= w; x += 30) {
      const wave = Math.sin(x * 0.003 * r.freq + angle + idx) * r.amp +
                   Math.cos(x * 0.005 - angle * 2) * (r.amp * 0.4);
      ctx.lineTo(x, baseY + wave);
    }
    ctx.lineTo(w, h);
    ctx.closePath();

    ctx.fillStyle = r.color;
    ctx.shadowColor = r.color;
    ctx.shadowBlur = r.blur;
    ctx.fill();
    ctx.restore();
  });

  // Vignette
  const vig = ctx.createRadialGradient(w/2, h/2, w*0.25, w/2, h/2, Math.max(w,h)*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);
};
</script>
</body>
</html>
